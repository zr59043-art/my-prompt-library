<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>提示词库 · Prompt Library</title>
<style>
  /* ============================================================
     设计 token —— 柔和温馨，与「提示词生成器」共用
     ============================================================ */
  :root {
    color-scheme: light;

    --bg: #fdf8f2;                                 /* 暖调纸白 */
    --panel: rgba(255, 255, 255, .86);
    --panel-solid: #fffdfa;
    --panel-soft: #fdf7f0;
    --border: #f0e4d6;
    --border-strong: #e2d1bd;

    --text: #453629;                               /* 暖褐正文 */
    --muted: #8a7360;
    --faint: #b3a08c;

    --coral: #ff8a6b;                              /* 珊瑚 */
    --coral-deep: #ea6a48;
    --coral-soft: #fff0ea;
    --coral-line: #ffcab8;

    --peach: #ffb184;                              /* 蜜桃 */
    --rose: #f491b4;                               /* 玫瑰粉 */
    --rose-soft: #fff0f5;
    --lav: #b9a5e8;                                /* 薰衣草 */
    --sage: #83c5a4;                               /* 鼠尾草绿 */
    --sage-deep: #5aaa84;
    --sage-soft: #ebf8f1;
    --gold: #e8b34a;                               /* 暖金 */
    --gold-soft: #fdf6e3;
    --honey: #d98324;                              /* 蜜糖橙（警告文字用） */
    --danger: #d9534f;

    --glow-coral: 0 0 0 3px rgba(255, 138, 107, .18), 0 0 20px rgba(255, 138, 107, .12);
    --glow-primary: 0 4px 18px rgba(255, 138, 107, .34);
    --shadow-sm: 0 1px 3px rgba(150, 110, 75, .08);
    --shadow-md: 0 10px 30px rgba(150, 110, 75, .10);

    --radius-sm: 7px;
    --radius: 11px;
    --radius-lg: 16px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  /* 暖光 + 细点阵：
     第一层是极浅的点阵（暖褐 6%），铺满整页像细麻布；
     下三层是珊瑚 / 玫瑰 / 金的柔软光晕，固定不动。 */
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: var(--bg);
    background-image:
      radial-gradient(rgba(160, 120, 85, .16) 1px, transparent 1px),
      radial-gradient(900px 520px at 8% -16%,   rgba(255, 177, 132, .34), transparent 62%),
      radial-gradient(860px 500px at 94% -8%,   rgba(244, 145, 180, .26), transparent 64%),
      radial-gradient(800px 540px at 50% 116%,  rgba(131, 197, 164, .20), transparent 62%),
      radial-gradient(640px 420px at 76% 46%,   rgba(232, 179, 74, .16), transparent 72%);
    background-size: 18px 18px, auto, auto, auto, auto;
    background-attachment: fixed;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat;
    color: var(--text);
    font: 14px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* ============================================================
     顶栏
     ============================================================ */
  .topbar {
    position: relative;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(255, 252, 248, .8);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  /* 顶栏底边一道暖色细线 */
  .topbar::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent, var(--peach), var(--rose), var(--gold), transparent);
    opacity: .55;
  }

  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }

  .brand .logo {
    flex: 0 0 auto;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    color: #fff;
    background: linear-gradient(135deg, var(--peach), var(--coral-deep));
    border-radius: var(--radius-sm);
    box-shadow: 0 3px 12px rgba(255, 138, 107, .38);
  }

  .brand h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; }

  .count-pill {
    flex: 0 0 auto;
    padding: 2px 11px;
    font-size: 11.5px;
    color: var(--muted);
    background: var(--gold-soft);
    border: 1px solid #f2e3c2;
    border-radius: 999px;
    white-space: nowrap;
  }

  /* 跳转到另一个页面的胶囊按钮 */
  .jump-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: 0 0 auto;
    padding: 7px 15px;
    font-size: 13px;
    font-weight: 600;
    color: var(--coral-deep);
    text-decoration: none;
    background: var(--coral-soft);
    border: 1px solid var(--coral-line);
    border-radius: 999px;
    transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
  }
  .jump-btn:hover {
    background: #ffe4da;
    border-color: var(--coral);
    box-shadow: 0 4px 16px rgba(255, 138, 107, .26);
    transform: translateY(-1px);
  }
  .jump-btn .arrow { transition: transform .18s; }
  .jump-btn:hover .arrow { transform: translateX(3px); }

  /* ============================================================
     三栏栅格：1 : 2 : 3 = 1/6 : 1/3 : 1/2
     ============================================================ */
  .app {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(190px, 1fr) minmax(230px, 2fr) minmax(300px, 3fr);
    gap: 12px;
    padding: 12px;
    overflow: hidden;
  }

  .col {
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
  }

  .col-head {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--coral-soft), transparent);
  }

  .col-head h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
    color: var(--faint);
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .col-body {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    overflow-y: auto;
  }

  #detailBody { padding: 18px 20px; gap: 0; }

  /* ============================================================
     通用控件
     ============================================================ */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 13px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel-solid);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s, border-color .18s, box-shadow .18s, transform .18s;
  }
  .btn:hover:not(:disabled) {
    background: #fff8f2;
    border-color: var(--coral-line);
    box-shadow: 0 3px 12px rgba(200, 150, 110, .14);
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn-primary {
    color: #fff;
    background: linear-gradient(135deg, var(--peach), var(--coral-deep));
    border-color: transparent;
    box-shadow: var(--glow-primary);
  }
  .btn-primary:hover:not(:disabled) {
    background: linear-gradient(135deg, #ffc099, #f07a58);
    border-color: transparent;
  }

  .btn-danger { color: var(--danger); border-color: #f2c4c2; }
  .btn-danger:hover:not(:disabled) { background: #fdf1f1; border-color: var(--danger); }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 21px; height: 21px;
    padding: 0;
    font-size: 12px;
    line-height: 1;
    color: var(--faint);
    background: transparent;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background .14s, color .14s;
  }
  .icon-btn:hover { background: var(--coral-soft); color: var(--coral-deep); }

  #search {
    width: 120px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12px;
    color: var(--text);
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color .18s, box-shadow .18s;
  }
  #search:focus { border-color: var(--coral); box-shadow: var(--glow-coral); }
  #search::placeholder { color: #c4b4a2; }

  /* ============================================================
     左侧：分类树
     ============================================================ */
  .cat-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    user-select: none;
    transition: background .14s, color .14s, outline-color .14s;
  }
  .cat-item:hover { background: var(--coral-soft); }

  .cat-item.active {
    color: var(--coral-deep);
    font-weight: 600;
    background: linear-gradient(90deg, #ffe3d8, var(--gold-soft) 70%, transparent);
  }
  .cat-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 3px; height: 16px;
    margin-top: -8px;
    background: linear-gradient(180deg, var(--peach), var(--coral-deep));
    border-radius: 0 3px 3px 0;
  }

  .caret { width: 12px; flex: 0 0 12px; text-align: center; font-size: 10px; color: var(--faint); }
  .caret.leaf { color: transparent; }

  .cat-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }

  .cat-count { flex: 0 0 auto; font-size: 11px; color: var(--faint); font-weight: 400; }
  .cat-item.active .cat-count { color: var(--coral-deep); }

  .cat-actions { flex: 0 0 auto; display: flex; gap: 1px; visibility: hidden; }
  .cat-item:hover .cat-actions { visibility: visible; }

  /* ---------- 拖拽：分类项作为放置目标 ---------- */
  body.is-dragging .cat-item {
    outline: 1px dashed var(--border-strong);
    outline-offset: -1px;
  }
  body.is-dragging .cat-item.drop-target {
    color: var(--sage-deep);
    background: linear-gradient(90deg, #d8f2e4, var(--sage-soft) 70%, transparent);
    outline: 2px dashed var(--sage);
    outline-offset: -2px;
  }
  body.is-dragging .cat-item.drop-target .cat-count { color: var(--sage-deep); }

  /* ============================================================
     中间：梗概列表
     ============================================================ */
  .p-item {
    position: relative;
    padding: 9px 12px 9px 25px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-solid);
    cursor: pointer;
    transition: border-color .14s, box-shadow .14s, background .14s;
  }
  .p-item:hover {
    border-color: var(--coral-line);
    background: #fffaf6;
    box-shadow: 0 4px 16px rgba(200, 150, 110, .14);
  }
  .p-item.active {
    background: linear-gradient(140deg, var(--coral-soft), var(--gold-soft));
    border-color: var(--coral);
    box-shadow: 0 4px 18px rgba(255, 138, 107, .18);
  }

  /* 左侧的拖拽握把，hover 时才显形 */
  .p-item::before {
    content: '⠿';
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    line-height: 1;
    color: var(--faint);
    opacity: 0;
    transition: opacity .14s, color .14s;
  }
  .p-item:hover::before { opacity: 1; color: var(--coral-deep); }
  .p-item[draggable="true"] { cursor: grab; }
  .p-item[draggable="true"]:active { cursor: grabbing; }
  .p-item.dragging { opacity: .4; box-shadow: none; }

  .p-item-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .p-item h3 { margin: 0 0 4px; font-size: 13.5px; font-weight: 600; line-height: 1.5; color: #4d3a2a; }
  .p-item.active h3 { color: var(--coral-deep); }
  .p-item time { flex: 0 0 auto; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .p-item p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ============================================================
     右侧：详情
     ============================================================ */
  .detail-title {
    margin: 2px 0 10px;
    font-size: 21px;
    line-height: 1.4;
    letter-spacing: -.01em;
    color: #45321f;
  }

  .detail-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 16px; font-size: 12px; color: var(--muted);
  }

  .tag {
    padding: 2px 10px;
    font-size: 12px;
    color: #7a63b0;
    background: #f4efff;
    border: 1px solid #ddd0f7;
    border-radius: 999px;
  }

  .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

  .detail-content {
    margin: 0;
    padding: 16px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    color: #5a4736;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  /* ============================================================
     编辑表单
     ============================================================ */
  .form { display: flex; flex-direction: column; gap: 14px; }
  .form-row { display: flex; flex-direction: column; gap: 5px; }
  .form-row label { font-size: 12px; font-weight: 600; color: #9b87c9; }

  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;
    padding: 9px 11px;
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
    resize: vertical;
    transition: border-color .18s, box-shadow .18s, background .18s;
  }

  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus {
    background: #fff;
    border-color: var(--coral);
    box-shadow: var(--glow-coral);
  }

  .form-row textarea.mono { font-family: var(--mono); line-height: 1.75; }
  .form-actions { display: flex; gap: 8px; padding-top: 2px; }

  /* ============================================================
     空状态
     ============================================================ */
  .empty-state {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 28px 24px;
    text-align: center;
    color: var(--faint);
  }
  .empty-state strong { font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .empty-state span { font-size: 12.5px; line-height: 1.7; max-width: 26em; }

  /* ============================================================
     吐司
     ============================================================ */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    z-index: 999;
    padding: 9px 19px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(135deg, var(--peach), var(--coral-deep));
    border-radius: 999px;
    box-shadow: 0 10px 28px rgba(234, 106, 72, .34);
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 12px);
    transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ============================================================
     滚动条
     ============================================================ */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb {
    background: #e6d5c2;
    border: 3px solid transparent;
    background-clip: content-box;
    border-radius: 999px;
  }
  ::-webkit-scrollbar-thumb:hover { background: #d8c1a8; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============================================================
     窄屏降级
     ============================================================ */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { grid-template-columns: 1fr; height: auto; overflow: visible; }
    .col { min-height: 320px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">LIB</span>
    <h1>提示词库</h1>
    <span class="count-pill" id="libCount"></span>
  </div>
  <a class="jump-btn" href="prompt生成器_联动库.html">CO-STAR 生成器 <span class="arrow">→</span></a>
</header>

<div class="app">
  <!-- 左：分类（1/6） -->
  <aside class="col">
    <header class="col-head">
      <h2>分类</h2>
      <button class="icon-btn" id="btnAddRoot" title="新建根分类">＋</button>
    </header>
    <div class="col-body" id="catTree"></div>
  </aside>

  <!-- 中：梗概（1/3） -->
  <section class="col">
    <header class="col-head">
      <h2 id="listTitle">提示词</h2>
      <div style="display:flex;align-items:center;gap:6px;min-width:0">
        <input id="search" type="search" placeholder="搜索" />
        <button class="btn" id="btnNewPrompt" disabled>＋ 新建</button>
      </div>
    </header>
    <div class="col-body" id="promptList"></div>
  </section>

  <!-- 右：详情（1/2） -->
  <section class="col">
    <header class="col-head">
      <h2>详情</h2>
      <span id="detailMeta" style="font-size:11px;color:var(--faint)"></span>
    </header>
    <div class="col-body" id="detailBody"></div>
  </section>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 0. 工具函数
   * ============================================================ */
  const STORE_KEY = 'prompt-library-v1';
  const $ = (sel) => document.querySelector(sel);
  const uid = () => 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
  ));
  const pad2 = (n) => String(n).padStart(2, '0');

  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate())
      + ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function makeSummary(text) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();
    return s.length > 60 ? s.slice(0, 60) + '…' : s;
  }

  function emptyHTML(title, desc) {
    return '<div class="empty-state"><strong>' + esc(title) + '</strong><span>' + esc(desc) + '</span></div>';
  }

  let toastTimer = null;
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
  }

  async function copyText(text) {
    // 优先使用异步剪贴板 API（需安全上下文）
    if (navigator.clipboard && window.isSecureContext) {
      try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* 降级 */ }
    }
    // 降级方案：隐藏 textarea + execCommand
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      ta.remove();
      return ok;
    } catch (e) {
      return false;
    }
  }

  /* ============================================================
   * 1. 种子数据（首次打开时注入）
   * ============================================================ */
  const SEED = {
    categories: [
      { id: 'cat-dev',      name: '代码开发', parentId: null },
      { id: 'cat-review',   name: '代码审查', parentId: 'cat-dev' },
      { id: 'cat-refactor', name: '重构优化', parentId: 'cat-dev' },
      { id: 'cat-test',     name: '单元测试', parentId: 'cat-dev' },
      { id: 'cat-doc',      name: '文档写作', parentId: null },
      { id: 'cat-api',      name: '接口文档', parentId: 'cat-doc' },
      { id: 'cat-arch',     name: '架构设计', parentId: null }
    ],
    prompts: [
      {
        id: 'p-review',
        categoryId: 'cat-review',
        title: '资深架构师代码审查',
        summary: '以资深架构师视角逐维度审查代码，输出按严重程度分级的问题清单与可执行修复代码。',
        content: [
          '你是一名拥有 15 年一线经验的资深软件架构师，精通 Java、分布式系统与性能调优。',
          '',
          '任务：审查我提供的代码，输出结构化审查报告。',
          '',
          '审查维度（逐项检查，不得遗漏）：',

  /* ============================================================
   * 2. 状态与持久化
   * ============================================================ */
  function loadState() {
    let raw = null;
    try {
      raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    } catch (e) {
      console.warn('[提示词库] 本地数据解析失败，已回退到示例数据。', e);
    }
    const data = (raw && Array.isArray(raw.categories) && Array.isArray(raw.prompts))
      ? raw
      : JSON.parse(JSON.stringify(SEED));

    return {
      categories: data.categories,
      prompts: data.prompts,
      // 以下为纯 UI 状态，不落盘
      selectedCategoryId: null,
      selectedPromptId: null,
      editingId: null,   // 正在编辑的提示词 id；为 null 且 draft 存在时表示新建
      draft: null,       // 编辑态的数据副本，保存前不污染源数据
      expanded: {},      // categoryId -> boolean，缺省视为展开
      query: ''
    };
  }

  function persist() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        categories: state.categories,
        prompts: state.prompts
      }));
    } catch (e) {
      console.error('[提示词库] 写入本地存储失败。', e);
      toast('保存失败：本地存储不可用');
    }
  }

  let state = loadState();

  /* ============================================================
   * 3. 数据查询辅助
   * ============================================================ */
  const catChildren = (pid) => state.categories.filter((c) => c.parentId === pid);

  // 收集某分类及其全部后代的 id
  function collectIds(id, out) {
    out = out || [];
    out.push(id);
    catChildren(id).forEach((c) => collectIds(c.id, out));
    return out;
  }

  function categoryPath(id) {
    const chain = [];
    let cur = state.categories.find((c) => c.id === id);
    let guard = 0;
    while (cur && guard++ < 50) {
      chain.unshift(cur.name);
      cur = state.categories.find((c) => c.id === cur.parentId);
    }
    return chain.length ? chain.join(' / ') : '未分类';
  }

  /* ============================================================
   * 4. 渲染：左侧分类树
   * ============================================================ */
  function renderCategories() {
    const tree = $('#catTree');
    const roots = catChildren(null);
    tree.innerHTML = '';

    if (!roots.length) {
      tree.innerHTML = emptyHTML('尚无分类', '点击右上角「＋」创建第一个分类，再通过分类项上的「＋」建立子分类。');
      return;
    }

    const walk = (list, depth) => {
      list.forEach((cat) => {
        const kids = catChildren(cat.id);
        const open = state.expanded[cat.id] !== false;
        const count = collectIds(cat.id)
          .reduce((n, id) => n + state.prompts.filter((p) => p.categoryId === id).length, 0);

        const el = document.createElement('div');
        el.className = 'cat-item' + (state.selectedCategoryId === cat.id ? ' active' : '');
        el.dataset.id = cat.id;
        el.style.paddingLeft = (6 + depth * 14) + 'px';
        el.innerHTML =
          '<span class="caret' + (kids.length ? '' : ' leaf') + '">' +
            (kids.length ? (open ? '▾' : '▸') : '·') +
          '</span>' +
          '<span class="cat-name" title="' + esc(cat.name) + '">' + esc(cat.name) + '</span>' +
          '<span class="cat-count">' + (count || '') + '</span>' +
          '<span class="cat-actions">' +
            '<button class="icon-btn" data-act="add" title="新建子分类">＋</button>' +
            '<button class="icon-btn" data-act="rename" title="重命名">✎</button>' +
            '<button class="icon-btn" data-act="remove" title="删除">✕</button>' +
          '</span>';

        tree.appendChild(el);
        if (kids.length && open) walk(kids, depth + 1);
      });
    };

    walk(roots, 0);
  }

  /* ============================================================
   * 5. 渲染：中间梗概列表
   * ============================================================ */
  function renderList() {
    const listEl = $('#promptList');
    const titleEl = $('#listTitle');
    const btnNew = $('#btnNewPrompt');
    const cat = state.categories.find((c) => c.id === state.selectedCategoryId);

    if (!cat) {
      titleEl.textContent = '提示词';
      btnNew.disabled = true;
      listEl.innerHTML = emptyHTML('未选择分类', '在左侧点击一个分类，这里将列出该分类及其全部子分类下的提示词梗概。');
      return;
    }

    titleEl.textContent = cat.name;
    btnNew.disabled = false;

    const ids = new Set(collectIds(cat.id));
    let items = state.prompts.filter((p) => ids.has(p.categoryId));

    const q = state.query.trim().toLowerCase();
    if (q) {
      items = items.filter((p) =>
        (p.title + ' ' + (p.summary || '') + ' ' + p.content).toLowerCase().includes(q)
      );
    }

    items.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

    if (!items.length) {
      listEl.innerHTML = q
        ? emptyHTML('无匹配结果', '当前分类下没有命中的提示词，尝试更换关键词。')
        : emptyHTML('该分类暂无提示词', '点击右上角「＋ 新建」，在此分类下创建第一条提示词。');
      return;
    }

    listEl.innerHTML = items.map((p) =>
      '<div class="p-item' + (p.id === state.selectedPromptId ? ' active' : '') + '"'
        + ' data-id="' + p.id + '" draggable="true" title="按住拖到左侧分类可移动">' +
        '<div class="p-item-top">' +
          '<h3>' + esc(p.title) + '</h3>' +
          '<time>' + esc(fmtTime(p.updatedAt).slice(5, 10)) + '</time>' +
        '</div>' +
        '<p>' + esc(p.summary || makeSummary(p.content)) + '</p>' +
      '</div>'
    ).join('');
  }

  /* ============================================================
   * 6. 渲染：右侧详情 / 编辑表单
   * ============================================================ */
  function buildCategoryOptions(selectedId) {
    const out = [];
    const walk = (pid, depth) => {
      catChildren(pid).forEach((c) => {
        const indent = '\u3000'.repeat(depth); // 全角空格制造层级缩进
        out.push(
          '<option value="' + c.id + '"' + (c.id === selectedId ? ' selected' : '') + '>' +
            indent + esc(c.name) +
          '</option>'
        );
        walk(c.id, depth + 1);
      });
    };
    walk(null, 0);
    return out.join('');
  }

  function viewHTML(p) {
    return '' +
      '<article class="detail">' +
        '<h1 class="detail-title">' + esc(p.title) + '</h1>' +
        '<div class="detail-meta">' +
          '<span class="tag">' + esc(categoryPath(p.categoryId)) + '</span>' +
          '<span>更新于 ' + esc(fmtTime(p.updatedAt)) + '</span>' +
          '<span>' + p.content.length + ' 字符</span>' +
        '</div>' +
        '<div class="detail-actions">' +
          '<button class="btn btn-primary" data-act="copy">复制内容</button>' +
          '<button class="btn" data-act="edit">编辑</button>' +
          '<button class="btn btn-danger" data-act="delete">删除</button>' +
        '</div>' +
        '<pre class="detail-content">' + esc(p.content) + '</pre>' +
      '</article>';
  }

  function formHTML(d, isNew) {
    return '' +
      '<div class="form">' +
        '<div class="form-row">' +
          '<label for="f-title">标题</label>' +
          '<input id="f-title" type="text" value="' + esc(d.title) + '" placeholder="例如：资深架构师代码审查" />' +
        '</div>' +
        '<div class="form-row">' +
          '<label for="f-cat">所属分类</label>' +
          '<select id="f-cat">' + buildCategoryOptions(d.categoryId) + '</select>' +
        '</div>' +
        '<div class="form-row">' +
          '<label for="f-summary">梗概（留空将自动截取正文前 60 字）</label>' +
          '<textarea id="f-summary" rows="2" placeholder="一句话说明这条提示词的用途">' + esc(d.summary) + '</textarea>' +
        '</div>' +
        '<div class="form-row">' +
          '<label for="f-content">提示词正文</label>' +
          '<textarea id="f-content" rows="18" class="mono" placeholder="在此撰写完整提示词内容">' + esc(d.content) + '</textarea>' +
        '</div>' +
        '<div class="form-actions">' +
          '<button class="btn btn-primary" data-act="save">' + (isNew ? '创建' : '保存') + '</button>' +
          '<button class="btn" data-act="cancel">取消</button>' +
        '</div>' +
      '</div>';
  }

  function renderDetail() {
    const host = $('#detailBody');
    const meta = $('#detailMeta');

    // 编辑态优先
    if (state.draft) {
      const isNew = !state.editingId;
      meta.textContent = isNew ? '新建中' : '编辑中';
      host.innerHTML = formHTML(state.draft, isNew);
      if (isNew) {
        const t = $('#f-title');
        if (t) t.focus();
      }
      return;
    }

    const p = state.prompts.find((x) => x.id === state.selectedPromptId);
    if (!p) {
      meta.textContent = '';
      host.innerHTML = emptyHTML('未选择提示词', '在中间列表点击任意梗概，此处将显示完整提示词内容，并提供复制与编辑操作。');
      return;
    }

    meta.textContent = fmtTime(p.updatedAt);
    host.innerHTML = viewHTML(p);
  }

  function renderCount() {
    const pill = $('#libCount');
    if (pill) {
      pill.textContent = state.categories.length + ' 个分类 · ' + state.prompts.length + ' 条提示词';
    }
  }

  function renderAll() {
    renderCategories();
    renderList();
    renderDetail();
    renderCount();
  }

  /* ============================================================
   * 7. 业务动作
   * ============================================================ */
  function selectCategory(id) {
    state.selectedCategoryId = id;
    // 若当前选中的提示词不属于新分类的分支，则清空右栏
    if (state.selectedPromptId) {
      const scope = new Set(collectIds(id));
      const cur = state.prompts.find((p) => p.id === state.selectedPromptId);
      if (!cur || !scope.has(cur.categoryId)) {
        state.selectedPromptId = null;
        state.draft = null;
        state.editingId = null;
      }
    }
    renderAll();
  }

  function addCategory(parentId) {
    const name = prompt(parentId ? '新建子分类，请输入名称：' : '新建根分类，请输入名称：');
    if (!name || !name.trim()) return;
    const id = uid();
    state.categories.push({ id: id, name: name.trim(), parentId: parentId || null });
    if (parentId) state.expanded[parentId] = true;
    persist();
    renderCategories();
    toast('分类已创建');
  }

  function renameCategory(id) {
    const cat = state.categories.find((c) => c.id === id);
    if (!cat) return;
    const name = prompt('重命名分类：', cat.name);
    if (!name || !name.trim()) return;
    cat.name = name.trim();
    persist();
    renderAll();
  }

  function removeCategory(id) {
    const cat = state.categories.find((c) => c.id === id);
    if (!cat) return;
    const ids = collectIds(id);
    const childCount = ids.length - 1;
    const promptCount = state.prompts.filter((p) => ids.indexOf(p.categoryId) !== -1).length;

    const msg = '确认删除分类「' + cat.name + '」？\n\n'
      + '· 将同时删除 ' + childCount + ' 个子分类\n'
      + '· 将同时删除 ' + promptCount + ' 条提示词\n\n'
      + '此操作不可撤销。';
    if (!confirm(msg)) return;

    const dead = new Set(ids);
    state.categories = state.categories.filter((c) => !dead.has(c.id));
    state.prompts = state.prompts.filter((p) => !dead.has(p.categoryId));

    if (dead.has(state.selectedCategoryId)) state.selectedCategoryId = null;
    if (state.selectedPromptId && !state.prompts.some((p) => p.id === state.selectedPromptId)) {
      state.selectedPromptId = null;
    }
    state.draft = null;
    state.editingId = null;

    persist();
    renderAll();
    toast('分类已删除');
  }

  function startNewPrompt() {
    if (!state.selectedCategoryId) return;
    state.selectedPromptId = null;
    state.editingId = null;
    state.draft = {
      id: null,
      title: '',
      summary: '',
      content: '',
      categoryId: state.selectedCategoryId,
      updatedAt: Date.now()
    };
    renderAll();
  }

  function startEditPrompt() {
    const p = state.prompts.find((x) => x.id === state.selectedPromptId);
    if (!p) return;
    state.editingId = p.id;
    state.draft = Object.assign({}, p); // 浅拷贝足够（字段均为原始值）
    renderDetail();
  }

  function cancelEdit() {
    state.draft = null;
    state.editingId = null;
    renderAll();
  }

  function saveDraft() {
    const titleEl = $('#f-title');
    const contentEl = $('#f-content');
    const catEl = $('#f-cat');
    const summaryEl = $('#f-summary');
    if (!titleEl || !contentEl || !catEl || !summaryEl) return;

    const title = titleEl.value.trim();
    const content = contentEl.value;
    const categoryId = catEl.value;
    let summary = summaryEl.value.trim();

    if (!title) {
      toast('标题不能为空');
      titleEl.focus();
      return;
    }
    if (!summary) summary = makeSummary(content);

    const now = Date.now();

    if (state.editingId) {
      const p = state.prompts.find((x) => x.id === state.editingId);
      if (p) {
        Object.assign(p, { title: title, summary: summary, content: content, categoryId: categoryId, updatedAt: now });
        state.selectedPromptId = p.id;
      }
    } else {
      const np = { id: uid(), title: title, summary: summary, content: content, categoryId: categoryId, updatedAt: now };
      state.prompts.push(np);
      state.selectedPromptId = np.id;
    }

    state.draft = null;
    state.editingId = null;
    persist();
    renderAll();
    toast('已保存');
  }

  function deletePrompt() {
    const p = state.prompts.find((x) => x.id === state.selectedPromptId);
    if (!p) return;
    if (!confirm('确认删除提示词「' + p.title + '」？此操作不可撤销。')) return;
    state.prompts = state.prompts.filter((x) => x.id !== p.id);
    state.selectedPromptId = null;
    persist();
    renderAll();
    toast('已删除');
  }

  async function copyCurrent() {
    const p = state.prompts.find((x) => x.id === state.selectedPromptId);
    if (!p) return;
    const ok = await copyText(p.content);
    toast(ok ? '已复制到剪贴板' : '复制失败，请手动选择文本');
  }

  /* ============================================================
   * 8. 事件绑定
   * ============================================================ */
  // 8.1 分类树：事件委托
  $('#catTree').addEventListener('click', (e) => {
    const item = e.target.closest('.cat-item');
    if (!item) return;
    const id = item.dataset.id;

    const actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      e.stopPropagation();
      const act = actBtn.dataset.act;
      if (act === 'add') addCategory(id);
      else if (act === 'rename') renameCategory(id);
      else if (act === 'remove') removeCategory(id);
      return;
    }

    if (e.target.classList.contains('caret')) {
      const isOpen = state.expanded[id] !== false;
      state.expanded[id] = !isOpen;
      renderCategories();
      return;
    }

    selectCategory(id);
  });

  // 8.2 梗概列表：事件委托
  $('#promptList').addEventListener('click', (e) => {
    const item = e.target.closest('.p-item');
    if (!item) return;
    if (state.draft && !confirm('当前编辑尚未保存，确认放弃并切换？')) return;
    state.draft = null;
    state.editingId = null;
    state.selectedPromptId = item.dataset.id;
    renderAll();
  });

  // 8.3 详情区：事件委托
  $('#detailBody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const act = btn.dataset.act;
    if (act === 'copy') copyCurrent();
    else if (act === 'edit') startEditPrompt();
    else if (act === 'save') saveDraft();
    else if (act === 'cancel') cancelEdit();
    else if (act === 'delete') deletePrompt();
  });

  // 8.4 头部按钮与搜索
  $('#btnAddRoot').addEventListener('click', () => addCategory(null));
  $('#btnNewPrompt').addEventListener('click', startNewPrompt);
  $('#search').addEventListener('input', (e) => {
    state.query = e.target.value;
    renderList();
  });

  // 8.5 快捷键：Ctrl/Cmd + S 保存编辑
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      if (state.draft) {
        e.preventDefault();
        saveDraft();
      }
    }
    if (e.key === 'Escape' && state.draft) {
      cancelEdit();
    }
  });

  /* ============================================================
   * 8.6 拖拽：把中间列表里的提示词拖到左侧分类上
   * ============================================================ */
  let dragPromptId = null;

  function clearDropMarks() {
    document.querySelectorAll('.cat-item.drop-target')
      .forEach((n) => n.classList.remove('drop-target'));
  }

  function endDrag() {
    dragPromptId = null;
    document.body.classList.remove('is-dragging');
    clearDropMarks();
    document.querySelectorAll('.p-item.dragging')
      .forEach((n) => n.classList.remove('dragging'));
  }

  function movePromptToCategory(promptId, categoryId) {
    const p = state.prompts.find((x) => x.id === promptId);
    const cat = state.categories.find((c) => c.id === categoryId);
    if (!p || !cat) return;

    if (p.categoryId === categoryId) {
      toast('已经在这个分类下了');
      return;
    }

    // 编辑态下移动，先确认放弃未保存的改动
    if (state.draft && state.editingId === p.id) {
      if (!confirm('这条提示词正在编辑且尚未保存，确认放弃改动并移动？')) return;
      state.draft = null;
      state.editingId = null;
    }

    p.categoryId = categoryId;
    state.expanded[categoryId] = true;   // 展开目标分类，让用户看见它落到哪了

    // 故意不动 updatedAt：换分类是归档动作，不该篡改「更新于」
    persist();
    renderAll();
    toast('已移动到「' + cat.name + '」');
  }

  const promptListHost = $('#promptList');
  const catTreeHost = $('#catTree');

  promptListHost.addEventListener('dragstart', (e) => {
    const item = e.target.closest('.p-item');
    if (!item) return;
    dragPromptId = item.dataset.id;
    item.classList.add('dragging');
    document.body.classList.add('is-dragging');
    e.dataTransfer.effectAllowed = 'move';
    // Firefox 不调 setData 就不会真正启动拖拽
    e.dataTransfer.setData('text/plain', dragPromptId);
  });

  promptListHost.addEventListener('dragend', endDrag);

  catTreeHost.addEventListener('dragover', (e) => {
    if (!dragPromptId) return;              // 只接管从列表里拖出来的东西
    const item = e.target.closest('.cat-item');
    if (!item) return;
    e.preventDefault();                     // 不阻止默认行为就不会触发 drop
    e.dataTransfer.dropEffect = 'move';
    if (!item.classList.contains('drop-target')) {
      clearDropMarks();
      item.classList.add('drop-target');
    }
  });

  catTreeHost.addEventListener('dragleave', (e) => {
    // 只在真正离开整棵树时才清除，避免在分类之间移动时闪烁
    if (e.relatedTarget && catTreeHost.contains(e.relatedTarget)) return;
    clearDropMarks();
  });

  catTreeHost.addEventListener('drop', (e) => {
    const item = e.target.closest('.cat-item');
    if (!item || !dragPromptId) return;
    e.preventDefault();
    const promptId = dragPromptId;
    const targetId = item.dataset.id;
    endDrag();                              // 先清理高亮，再移动（移动会重绘列表）
    movePromptToCategory(promptId, targetId);
  });

  /* ============================================================
   * 9. 启动
   * ============================================================ */
  renderAll();
})();
</script>
</body>
</html>
